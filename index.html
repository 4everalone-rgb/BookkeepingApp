<script>// ============================================================
// NUCLEAR-SAFE DATA LAYER
// ============================================================
var STORAGE_KEY = 'genericFinances2026_v2';
var DATA_VERSION = 3;
var LEGACY_YEAR = 2026;
var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

var DEFAULT_CONFIG = {
  appName: 'My Finances',
  salarySources: ['Primary Income', 'Side Income'],
  categories: ['Food & Dining', 'Transport', 'Groceries', 'Entertainment', 'Health & Fitness', 'Shopping', 'Bills & Utilities', 'Miscellaneous'],
  fixedExpenses: [
    { name: 'Netflix', amount: 99.99 },
    { name: 'Spotify', amount: 69.99 }
  ],
  budgets: {
    'Food & Dining': 500,
    'Transport': 300,
    'Groceries': 400,
    'Entertainment': 200,
    'Health & Fitness': 300,
    'Shopping': 300,
    'Bills & Utilities': 500,
    'Miscellaneous': 200,
    'Fixed Expenses': 170
  }
};

var appData = null;
var currentMonth = null;
var storageMode = 'localStorage';
var memoryStore = null;

function isStorageAvailable(type) {
  try {
    var storage = window[type];
    var x = '__storage_test__';
    storage.setItem(x, x);
    storage.removeItem(x);
    return true;
  } catch (e) {
    return false;
  }
}

function getStorage() {
  if (storageMode === 'localStorage' && isStorageAvailable('localStorage')) return localStorage;
  if (storageMode === 'sessionStorage' && isStorageAvailable('sessionStorage')) return sessionStorage;
  return null;
}

function storageGetItem(key) {
  var s = getStorage();
  if (s) {
    try { return s.getItem(key); } catch (e) { return null; }
  }
  if (memoryStore && memoryStore[key] !== undefined) {
    return memoryStore[key];
  }
  return null;
}

function storageSetItem(key, value) {
  var s = getStorage();
  if (s) {
    try {
      s.setItem(key, value);
      hideSaveError();
      return true;
    } catch (e) {
      // Do NOT switch to memory mode - the next save tries localStorage again.
      console.error('Save failed:', e);
      showSaveError();
      return false;
    }
  }
  // localStorage was unavailable at load - memory fallback.
  if (!memoryStore) memoryStore = {};
  memoryStore[key] = value;
  return true;
}

function showSaveError() {
  var banner = document.getElementById('saveErrorBanner');
  if (banner) banner.classList.add('show');
}

function hideSaveError() {
  var banner = document.getElementById('saveErrorBanner');
  if (banner) banner.classList.remove('show');
}

// Raw backups bypass storageSetItem on purpose: they must hit localStorage
// directly and fall back to a file download instead of the memory store.
function downloadJsonString(str, filename) {
  var blob = new Blob([str], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Android Chrome fetches the blob after click() returns; revoking right away breaks the download.
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

function backupRawData(key, raw, overwrite) {
  if (raw === null || raw === undefined) return false;
  try {
    if (!overwrite && localStorage.getItem(key) !== null) return true;
    localStorage.setItem(key, raw);
    return true;
  } catch (e) {
    console.warn('Backup write failed, downloading instead:', e);
    try { downloadJsonString(raw, key + '.json'); } catch (e2) { console.error(e2); }
    return false;
  }
}

function makeMonthKey(year, monthIndex) {
  return String(year) + '-' + String(monthIndex + 1).padStart(2, '0');
}

function parseMonthKey(key) {
  var m = /^(\d{4})-(\d{2})$/.exec(key === null || key === undefined ? '' : String(key));
  if (!m) return null;
  var mi = parseInt(m[2], 10) - 1;
  if (mi < 0 || mi > 11) return null;
  return { year: parseInt(m[1], 10), monthIndex: mi };
}

function monthNameOf(key) {
  var p = parseMonthKey(key);
  return p ? MONTH_NAMES[p.monthIndex] : String(key);
}

function yearOf(key) {
  var p = parseMonthKey(key);
  return p ? p.year : null;
}

function getSortedMonthKeys() {
  return Object.keys((appData && appData.months) || {}).sort();
}

function getYears() {
  var keys = getSortedMonthKeys();
  var years = [];
  for (var i = 0; i < keys.length; i++) {
    var y = yearOf(keys[i]);
    if (y !== null && years.indexOf(y) === -1) years.push(y);
  }
  years.sort(function(a, b) { return a - b; });
  return years;
}

function getMonthKeysForYear(year) {
  var keys = getSortedMonthKeys();
  var out = [];
  for (var i = 0; i < keys.length; i++) {
    if (yearOf(keys[i]) === parseInt(year, 10)) out.push(keys[i]);
  }
  return out;
}

function latestMonthKey() {
  var keys = getSortedMonthKeys();
  return keys.length ? keys[keys.length - 1] : null;
}

function currentCalendarMonthKey() {
  var now = new Date();
  return makeMonthKey(now.getFullYear(), now.getMonth());
}

function createDefaultData() {
  var data = {
    config: deepClone(DEFAULT_CONFIG),
    months: {},
    version: DATA_VERSION
  };
  var key = currentCalendarMonthKey();
  data.months[key] = createMonthData(key, data.config);
  return data;
}

function createMonthData(monthKey, config) {
  var parsed = parseMonthKey(monthKey);
  var month = {
    name: parsed ? MONTH_NAMES[parsed.monthIndex] : String(monthKey),
    year: parsed ? parsed.year : null,
    expenditures: {},
    salary: {},
    budgets: deepClone(config.budgets || {})
  };
  var cats = config.categories || [];
  for (var i = 0; i < cats.length; i++) {
    month.expenditures[cats[i]] = [];
  }
  month.expenditures['Fixed Expenses'] = deepClone(config.fixedExpenses || []);
  var sources = config.salarySources || [];
  for (var j = 0; j < sources.length; j++) {
    month.salary[sources[j]] = '';
  }
  return month;
}

function deepClone(obj) {
  if (obj === null || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) {
    var arr = [];
    for (var i = 0; i < obj.length; i++) arr.push(deepClone(obj[i]));
    return arr;
  }
  var cloned = {};
  for (var k in obj) {
    if (obj.hasOwnProperty(k)) cloned[k] = deepClone(obj[k]);
  }
  return cloned;
}

function validateAndRepairData(data) {
  if (!data || typeof data !== 'object') return createDefaultData();
  if (!data.config || typeof data.config !== 'object') data.config = deepClone(DEFAULT_CONFIG);
  if (!data.months || typeof data.months !== 'object') data.months = {};

  var cfg = data.config;
  if (!cfg.categories || !Array.isArray(cfg.categories) || cfg.categories.length === 0) {
    cfg.categories = deepClone(DEFAULT_CONFIG.categories);
  }
  if (!cfg.salarySources || !Array.isArray(cfg.salarySources) || cfg.salarySources.length === 0) {
    cfg.salarySources = deepClone(DEFAULT_CONFIG.salarySources);
  }
  if (!cfg.fixedExpenses || !Array.isArray(cfg.fixedExpenses)) {
    cfg.fixedExpenses = deepClone(DEFAULT_CONFIG.fixedExpenses);
  }
  if (!cfg.budgets || typeof cfg.budgets !== 'object') {
    cfg.budgets = deepClone(DEFAULT_CONFIG.budgets);
  }
  if (!cfg.appName || typeof cfg.appName !== 'string') {
    cfg.appName = DEFAULT_CONFIG.appName;
  }

  var monthKeys = Object.keys(data.months);
  if (monthKeys.length === 0) {
    var freshKey = currentCalendarMonthKey();
    data.months[freshKey] = createMonthData(freshKey, cfg);
  } else {
    for (var m = 0; m < monthKeys.length; m++) {
      var mk = monthKeys[m];
      var month = data.months[mk];
      if (!month || typeof month !== 'object') {
        data.months[mk] = createMonthData(mk, cfg);
        continue;
      }
      if (!month.expenditures || typeof month.expenditures !== 'object') month.expenditures = {};
      if (!month.salary || typeof month.salary !== 'object') month.salary = {};
      if (!month.budgets || typeof month.budgets !== 'object') month.budgets = {};
      var mkParsed = parseMonthKey(mk);
      if (mkParsed) {
        month.name = MONTH_NAMES[mkParsed.monthIndex];
        month.year = mkParsed.year;
      }

      for (var c = 0; c < cfg.categories.length; c++) {
        var cat = cfg.categories[c];
        if (!Array.isArray(month.expenditures[cat])) {
          month.expenditures[cat] = [];
        }
        if (month.budgets[cat] === undefined) {
          month.budgets[cat] = cfg.budgets[cat] || 0;
        }
      }
      if (!Array.isArray(month.expenditures['Fixed Expenses'])) {
        month.expenditures['Fixed Expenses'] = deepClone(cfg.fixedExpenses || []);
      }
      if (month.budgets['Fixed Expenses'] === undefined) {
        month.budgets['Fixed Expenses'] = cfg.budgets['Fixed Expenses'] || 0;
      }

      for (var s = 0; s < cfg.salarySources.length; s++) {
        var src = cfg.salarySources[s];
        if (month.salary[src] === undefined) month.salary[src] = '';
      }
    }
  }

  return data;
}

function needsMigration(data) {
  if (!data || typeof data !== 'object') return false;
  if (!data.version || data.version < DATA_VERSION) return true;
  if (data.config && data.config.banks) return true;
  var months = data.months || {};
  for (var k in months) {
    if (!months.hasOwnProperty(k)) continue;
    if (months[k] && months[k].balances) return true;
  }
  return false;
}

// v2 -> v3: month keys become 'YYYY-MM', banks / balances are dropped.
// Idempotent: months already keyed 'YYYY-MM' pass through untouched.
function migrateData(data) {
  var oldMonths = data.months || {};
  var newMonths = {};
  for (var k in oldMonths) {
    if (!oldMonths.hasOwnProperty(k)) continue;
    var key = k;
    if (!parseMonthKey(key)) {
      var idx = MONTH_NAMES.indexOf(k);
      if (idx === -1) {
        console.warn('Migration: skipping unrecognised month key "' + k + '"');
        continue;
      }
      key = makeMonthKey(LEGACY_YEAR, idx);
    }
    var parsed = parseMonthKey(key);
    var month = oldMonths[k];
    if (month && typeof month === 'object') {
      month.name = MONTH_NAMES[parsed.monthIndex];
      month.year = parsed.year;
      if (month.balances) delete month.balances;
    }
    newMonths[key] = month;
  }
  data.months = newMonths;
  if (data.config && data.config.banks) delete data.config.banks;
  data.version = DATA_VERSION;
  return data;
}

function initData() {
  try {
    var saved = storageGetItem(STORAGE_KEY);
    var parsed = null;
    if (saved) {
      try {
        parsed = JSON.parse(saved);
      } catch (pe) {
        console.error('Parse error:', pe);
        // Keep the corrupt-but-recoverable original before defaults overwrite it.
        backupRawData(STORAGE_KEY + '_corrupt_backup', saved);
        parsed = null;
      }
    }
    if (parsed) {
      if (needsMigration(parsed)) {
        backupRawData(STORAGE_KEY + '_backup_premigration', saved);
        parsed = migrateData(parsed);
        appData = validateAndRepairData(parsed);
        saveData();
      } else {
        appData = validateAndRepairData(parsed);
      }
    } else {
      appData = createDefaultData();
    }
  } catch (e) {
    console.error('Init error:', e);
    appData = createDefaultData();
  }
  if (!currentMonth || !appData.months[currentMonth]) {
    currentMonth = latestMonthKey() || currentCalendarMonthKey();
    if (!appData.months[currentMonth]) {
      appData.months[currentMonth] = createMonthData(currentMonth, appData.config);
    }
  }
}

function saveData() {
  try {
    storageSetItem(STORAGE_KEY, JSON.stringify(appData));
  } catch (e) {
    showToast('Error saving data');
    console.error('Save error:', e);
  }
}

// First month of `year` that has no data yet, starting after the latest
// existing month of that year. Returns -1 when the year is full.
function firstFreeMonthIndex(year) {
  var keys = getMonthKeysForYear(year);
  var start = 0;
  if (keys.length) {
    var last = parseMonthKey(keys[keys.length - 1]);
    if (last) start = last.monthIndex + 1;
  }
  for (var i = start; i < 12; i++) {
    if (!appData.months[makeMonthKey(year, i)]) return i;
  }
  for (var j = 0; j < 12; j++) {
    if (!appData.months[makeMonthKey(year, j)]) return j;
  }
  return -1;
}

function closeModal() {
  var host = document.getElementById('modalHost');
  if (host) host.innerHTML = '';
}

function openAddMonthModal() {
  var years = getYears();
  var calYear = new Date().getFullYear();
  if (years.indexOf(calYear) === -1) years.push(calYear);
  if (years.indexOf(calYear + 1) === -1) years.push(calYear + 1);

  var latest = latestMonthKey();
  var defYear = latest ? yearOf(latest) : calYear;
  if (firstFreeMonthIndex(defYear) === -1) defYear = defYear + 1;
  if (years.indexOf(defYear) === -1) years.push(defYear);
  years.sort(function(a, b) { return a - b; });

  var html = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">';
  html += '<div class="modal-card">';
  html += '<div class="modal-title">Add Month</div>';
  html += '<div class="modal-row"><span class="modal-label">Year</span>';
  html += '<select class="pill-select modal-select" id="addMonthYear" onchange="renderAddMonthOptions()">';
  for (var y = 0; y < years.length; y++) {
    html += '<option value="' + years[y] + '"' + (years[y] === defYear ? ' selected' : '') + '>' + years[y] + '</option>';
  }
  html += '</select></div>';
  html += '<div class="modal-row"><span class="modal-label">Month</span>';
  html += '<select class="pill-select modal-select" id="addMonthMonth"></select></div>';
  html += '<div class="modal-actions">';
  html += '<button class="btn-modal" onclick="closeModal()">Cancel</button>';
  html += '<button class="btn-modal btn-modal-primary" onclick="confirmAddMonth()">Add</button>';
  html += '</div></div></div>';

  var host = document.getElementById('modalHost');
  if (!host) return;
  host.innerHTML = html;
  renderAddMonthOptions();
}

function renderAddMonthOptions() {
  var ySel = document.getElementById('addMonthYear');
  var mSel = document.getElementById('addMonthMonth');
  if (!ySel || !mSel) return;
  var year = parseInt(ySel.value, 10);
  var free = firstFreeMonthIndex(year);
  var html = '';
  if (free === -1) {
    html = '<option value="" disabled selected>All months added</option>';
  } else {
    for (var i = 0; i < 12; i++) {
      var key = makeMonthKey(year, i);
      var taken = !!appData.months[key];
      html += '<option value="' + key + '"' + (taken ? ' disabled' : '') + (i === free ? ' selected' : '') + '>';
      html += MONTH_NAMES[i] + (taken ? ' (added)' : '') + '</option>';
    }
  }
  mSel.innerHTML = html;
}

function confirmAddMonth() {
  var mSel = document.getElementById('addMonthMonth');
  var key = mSel ? mSel.value : '';
  if (!key || appData.months[key]) {
    showToast('All months added for that year');
    return;
  }
  appData.months[key] = createMonthData(key, appData.config);
  currentMonth = key;
  closeModal();
  saveData();
  renderMonthBar();
  renderMonth();
  showToast(monthNameOf(key) + ' ' + yearOf(key) + ' added');
}

function openBackupModal() {
  var html = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">';
  html += '<div class="modal-card">';
  html += '<div class="modal-title">Backup &amp; Restore</div>';
  html += '<button class="btn-modal btn-modal-primary" style="width:100%;margin-bottom:8px;" onclick="downloadBackup()">Download backup</button>';
  html += '<button class="btn-modal" style="width:100%;" onclick="triggerRestorePicker()">Restore from file</button>';
  html += '<input type="file" class="modal-file" id="restoreFile" onchange="handleRestoreFile(this)">';
  html += '<div class="modal-actions"><button class="btn-modal" onclick="closeModal()">Cancel</button></div>';
  html += '</div></div>';

  var host = document.getElementById('modalHost');
  if (!host) return;
  host.innerHTML = html;
}

function downloadBackup() {
  try {
    var now = new Date();
    var stamp = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    downloadJsonString(JSON.stringify(appData), 'finances_backup_' + stamp + '.json');
    showToast('Backup downloaded');
  } catch (e) {
    console.error('Backup error:', e);
    showToast('Could not create backup');
  }
}

function triggerRestorePicker() {
  var input = document.getElementById('restoreFile');
  if (input) input.click();
}

function handleRestoreFile(input) {
  var file = input && input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var raw = String(ev.target.result);
    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    if (!parsed || typeof parsed !== 'object' ||
        !parsed.months || typeof parsed.months !== 'object' ||
        !parsed.config || typeof parsed.config !== 'object') {
      showToast('Not a valid backup file');
      return;
    }
    if (!confirm('Restore this backup? It replaces your current data.')) return;
    backupRawData(STORAGE_KEY + '_backup_prerestore', storageGetItem(STORAGE_KEY), true);
    if (needsMigration(parsed)) parsed = migrateData(parsed);
    appData = validateAndRepairData(parsed);
    currentMonth = latestMonthKey() || currentCalendarMonthKey();
    saveData();
    closeModal();
    renderMonthBar();
    renderMonth();
    showToast('Backup restored');
  };
  reader.onerror = function() { showToast('Could not read that file'); };
  reader.readAsText(file);
}

function switchMonth(month) {
  currentMonth = month;
  renderMonthBar();
  renderMonth();
  window.scrollTo(0, 0);
}

function switchYear(year) {
  var keys = getMonthKeysForYear(year);
  if (!keys.length) return;
  switchMonth(keys[keys.length - 1]);
}

function dateToSerial(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  var epoch = new Date(1899, 11, 30);
  var diff = d.getTime() - epoch.getTime();
  var days = diff / (1000 * 60 * 60 * 24);
  return Math.floor(days);
}

function serialToDateString(serial) {
  if (!serial && serial !== 0) return '';
  var epoch = new Date(1899, 11, 30);
  var d = new Date(epoch.getTime() + serial * 24 * 60 * 60 * 1000);
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function formatMoney(val) {
  if (val === '' || val === null || val === undefined || isNaN(val)) return '';
  var num = parseFloat(val);
  if (num === 0) return '0';
  return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  str = String(str);
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeJs(str) {
  if (str === null || str === undefined) return '';
  str = String(str);
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '\\r');
}

function attrEscape(str) {
  if (str === null || str === undefined) return '';
  str = String(str);
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderMonthBar() {
  try {
    var bar = document.getElementById('monthBar');
    if (!bar) return;
    var years = getYears();
    var curYear = yearOf(currentMonth);
    if (curYear === null) curYear = years.length ? years[years.length - 1] : new Date().getFullYear();

    var html = '<select class="pill-select sel-year" id="yearSelect" onchange="switchYear(this.value)">';
    for (var i = years.length - 1; i >= 0; i--) {
      html += '<option value="' + years[i] + '"' + (years[i] === curYear ? ' selected' : '') + '>' + years[i] + '</option>';
    }
    html += '</select>';

    html += '<select class="pill-select sel-month" id="monthSelect" onchange="switchMonth(this.value)">';
    var keys = getMonthKeysForYear(curYear);
    for (var j = 0; j < keys.length; j++) {
      html += '<option value="' + attrEscape(keys[j]) + '"' + (keys[j] === currentMonth ? ' selected' : '') + '>' + escapeHtml(monthNameOf(keys[j])) + '</option>';
    }
    html += '</select>';

    html += '<button class="btn-add-month" onclick="openAddMonthModal()">+ Month</button>';
    bar.innerHTML = html;
  } catch (e) {
    console.error('renderMonthBar error:', e);
  }
}

// ------------------------------------------------------------
// Android fix: never blow away the DOM while someone is mid-tap.
// Editing a field fires `change` on blur. On Android, tapping the
// next field (e.g. the date) blurs the previous one first, and the
// old full innerHTML rebuild destroyed the element being tapped, so
// the tap (and the date picker) got swallowed. applyRender() patches
// the existing nodes in place when the layout is unchanged, and only
// does a full rebuild when the structure actually changed.
// ------------------------------------------------------------
var pendingFullRender = null;

function isFormField(el) {
  return !!el && (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA');
}

function morphNode(oldNode, newNode) {
  if (oldNode.nodeType !== newNode.nodeType) return false;
  if (oldNode.nodeType === 3 || oldNode.nodeType === 8) {
    if (oldNode.nodeValue !== newNode.nodeValue) oldNode.nodeValue = newNode.nodeValue;
    return true;
  }
  if (oldNode.nodeType !== 1) return true;
  if (oldNode.tagName !== newNode.tagName) return false;
  if (oldNode.tagName === 'INPUT' && oldNode.type !== newNode.type) return false;
  if (oldNode.childNodes.length !== newNode.childNodes.length) return false;
  for (var c = 0; c < oldNode.childNodes.length; c++) {
    if (!morphNode(oldNode.childNodes[c], newNode.childNodes[c])) return false;
  }
  return true;
}

function syncNode(oldNode, newNode) {
  if (oldNode.nodeType === 3 || oldNode.nodeType === 8) return;
  if (oldNode.nodeType !== 1) return;
  var i, a;
  for (i = oldNode.attributes.length - 1; i >= 0; i--) {
    a = oldNode.attributes[i].name;
    if (!newNode.hasAttribute(a)) oldNode.removeAttribute(a);
  }
  for (i = 0; i < newNode.attributes.length; i++) {
    a = newNode.attributes[i];
    if (oldNode.getAttribute(a.name) !== a.value) oldNode.setAttribute(a.name, a.value);
  }
  if (oldNode.tagName === 'INPUT' && oldNode !== document.activeElement) {
    var nv = newNode.getAttribute('value') || '';
    if (oldNode.value !== nv) oldNode.value = nv;
  }
  for (i = 0; i < oldNode.childNodes.length; i++) syncNode(oldNode.childNodes[i], newNode.childNodes[i]);
}

function applyRender(container, html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  if (container.childNodes.length && morphNode(container, tmp)) {
    for (var i = 0; i < container.childNodes.length; i++) syncNode(container.childNodes[i], tmp.childNodes[i]);
    return;
  }
  var active = document.activeElement;
  if (isFormField(active) && container.contains(active)) {
    // Structure changed while the user is busy in a field (date picker open, typing):
    // wait until they leave it, then rebuild.
    if (pendingFullRender) return;
    pendingFullRender = setInterval(function () {
      var a = document.activeElement;
      if (isFormField(a) && container.contains(a)) return;
      clearInterval(pendingFullRender);
      pendingFullRender = null;
      renderMonth();
    }, 250);
    return;
  }
  container.innerHTML = html;
}

function openDatePicker(input) {
  // Desktop Chrome only opens the picker from the tiny icon; phones open it on tap anyway.
  try { if (input.showPicker) input.showPicker(); } catch (e) {}
}

function renderMonth() {
  var container = document.getElementById('mainContent');
  if (!container) return;
  try {
    var month = appData.months[currentMonth];
    var config = appData.config;
    if (!month || !config) {
      container.innerHTML = '<div style="padding:40px;text-align:center;color:#6b6b7b;">No data available for this month.</div>';
      return;
    }

    var appTitle = document.getElementById('appTitle');
    if (appTitle) appTitle.textContent = config.appName || 'My Finances';

    var appSubtitle = document.getElementById('appSubtitle');
    if (appSubtitle) appSubtitle.textContent = 'Personal Bookkeeping ' + (yearOf(currentMonth) || new Date().getFullYear());

    var html = '';

    html += '<div class="section-card">';
    html += '<div class="card-header"><span class="card-title">Income</span></div>';
    var salaryTotal = 0;
    var sources = config.salarySources || [];
    for (var i = 0; i < sources.length; i++) {
      var src = sources[i];
      var val = (month.salary && month.salary[src] !== undefined) ? month.salary[src] : '';
      html += '<div class="salary-row">';
      html += '<div class="inline-edit-wrap">';
      html += '<input type="text" class="salary-label" value="' + attrEscape(src) + '" onchange="renameSalarySource(' + i + ', this.value)" />';
      html += '<button class="btn-inline" onclick="removeSalarySource(' + i + ')">&#215;</button>';
      html += '</div>';
      html += '<input type="text" inputmode="decimal" class="salary-input" value="' + attrEscape(val) + '" onchange="updateSalary(' + "'" + escapeJs(src) + "'" + ',this.value)">';
      html += '</div>';
      if (val) salaryTotal += parseFloat(val) || 0;
    }
    html += '<div class="add-salary-bar">';
    html += '<input type="text" class="add-salary-input" id="newSalaryName" placeholder="New income source...">';
    html += '<button class="btn-add-salary" onclick="addSalarySourceFromUI()">Add</button>';
    html += '</div>';
    html += '<div class="card-header" style="border-top:1px solid #2a2a3a;"><span class="card-title">Total Income</span><span class="card-total">' + formatMoney(salaryTotal) + '</span></div>';
    html += '</div>';

    var cats = config.categories || [];
    for (var c = 0; c < cats.length; c++) {
      var cat = cats[c];
      var items = (month.expenditures && month.expenditures[cat]) || [];
      html += renderCategoryCard(cat, items, c);
    }

    html += '<div class="add-category-bar">';
    html += '<input type="text" class="add-category-input" id="newCategoryName" placeholder="New category name...">';
    html += '<button class="btn-add-cat" onclick="addCategoryFromUI()">Add Category</button>';
    html += '</div>';

    var fixedItems = (month.expenditures && month.expenditures['Fixed Expenses']) || [];
    html += renderFixedExpensesCard(fixedItems);

    html += renderSummaryTable(month, config);

    applyRender(container, html);
  } catch (e) {
    console.error('renderMonth FATAL:', e);
    container.innerHTML =
      '<div style="padding:40px 20px;text-align:center;">' +
      '<div style="font-size:1.2rem;font-weight:700;color:#ff6b6b;margin-bottom:12px;">&#9888; Something went wrong</div>' +
      '<div style="color:#8b8b9b;font-size:0.875rem;margin-bottom:20px;">The app hit an error while loading your data. Do not worry - your info is safe.</div>' +
      '<button onclick="nuclearReset()" style="padding:12px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#89CFF0,#5DADE2);color:#0a0a0f;font-weight:600;cursor:pointer;">Reset to Default</button>' +
      '<div style="margin-top:16px;color:#5b5b6b;font-size:0.75rem;font-family:monospace;word-break:break-all;">' + escapeHtml(String(e && e.message ? e.message : e)) + '</div>' +
      '</div>';
  }
}

function renderCategoryCard(cat, items, catIndex) {
  try {
    if (!items || !Array.isArray(items)) items = [];
    var html = '<div class="section-card">';
    html += '<div class="card-header">';
    html += '<div class="inline-edit-wrap">';
    html += '<input type="text" class="card-title" value="' + attrEscape(cat) + '" onchange="renameCategory(' + catIndex + ', this.value)" />';
    html += '<button class="btn-inline" onclick="removeCategory(' + catIndex + ')">&#215;</button>';
    html += '</div>';
    html += '</div>';

    var total = 0;
    for (var j = 0; j < items.length; j++) {
      var entry = items[j] || {};
      var dateStr = serialToDateString(entry.date);
      html += '<div class="row-entry">';
      html += '<input type="text" class="row-input input-desc" value="' + attrEscape(entry.desc || '') + '" placeholder="Description" onchange="updateEntry(' + "'" + escapeJs(cat) + "'" + ',' + j + ',' + "'desc'" + ',this.value)">';
      html += '<input type="date" class="row-input input-date" value="' + attrEscape(dateStr) + '" onclick="openDatePicker(this)" onchange="updateEntry(' + "'" + escapeJs(cat) + "'" + ',' + j + ',' + "'date'" + ',this.value)">';
      html += '<input type="text" inputmode="decimal" class="row-input input-amount" value="' + attrEscape(entry.amount || '') + '" placeholder="0" onchange="updateEntry(' + "'" + escapeJs(cat) + "'" + ',' + j + ',' + "'amount'" + ',this.value)">';
      html += '<button class="btn-delete" onclick="deleteEntry(' + "'" + escapeJs(cat) + "'" + ',' + j + ')">&#215;</button>';
      html += '</div>';
      if (entry.amount) total += parseFloat(entry.amount) || 0;
    }
    html += '<button class="btn-add" onclick="addEntry(' + "'" + escapeJs(cat) + "'" + ')">+ Add ' + escapeHtml(cat) + ' Entry</button>';

    html += '<div class="card-header" style="border-top:1px solid #2a2a3a;"><span class="card-title">Total</span><span class="card-total">' + formatMoney(total) + '</span></div>';
    html += '</div>';
    return html;
  } catch (e) {
    console.error('renderCategoryCard error:', e);
    return '<div class="section-card" style="padding:16px;color:#ff6b6b;">Error loading ' + escapeHtml(cat) + '</div>';
  }
}

function renderFixedExpensesCard(items) {
  try {
    if (!items || !Array.isArray(items)) items = [];
    var html = '<div class="section-card">';
    html += '<div class="card-header"><span class="card-title">Fixed Expenses</span></div>';

    var total = 0;
    for (var i = 0; i < items.length; i++) {
      var item = items[i] || {};
      html += '<div class="fixed-row">';
      html += '<input type="text" class="fixed-label" value="' + attrEscape(item.name || '') + '" onchange="renameFixedExpense(' + i + ', this.value)">';
      html += '<input type="text" inputmode="decimal" class="fixed-amount" value="' + attrEscape(item.amount !== undefined ? item.amount : '') + '" onchange="updateFixedExpenseAmount(' + i + ', this.value)">';
      html += '<button class="btn-inline" onclick="removeFixedExpense(' + i + ')">&#215;</button>';
      html += '</div>';
      total += parseFloat(item.amount) || 0;
    }

    html += '<div class="add-fixed-bar">';
    html += '<input type="text" class="add-fixed-input" id="newFixedName" placeholder="New fixed expense...">';
    html += '<input type="text" class="add-fixed-amt" id="newFixedAmt" placeholder="Amount">';
    html += '<button class="btn-add-fixed" onclick="addFixedExpenseFromUI()">Add</button>';
    html += '</div>';

    html += '<div class="card-header" style="border-top:1px solid #2a2a3a;"><span class="card-title">Total</span><span class="card-total">' + formatMoney(total) + '</span></div>';
    html += '</div>';
    return html;
  } catch (e) {
    console.error('renderFixedExpensesCard error:', e);
    return '<div class="section-card" style="padding:16px;color:#ff6b6b;">Error loading Fixed Expenses</div>';
  }
}

function renderSummaryTable(month, config) {
  try {
    var html = '<div class="section-card">';
    html += '<div class="card-header"><span class="card-title">Expenditure Summary</span></div>';
    html += '<table class="summary-table">';
    html += '<thead><tr><th>Category</th><th class="amount-cell">Amount</th><th class="budget-cell">Budgeted</th></tr></thead>';
    html += '<tbody>';

    var grandTotal = 0;
    var budgetTotal = 0;
    var cats = config.categories || [];

    for (var i = 0; i < cats.length; i++) {
      var cat = cats[i];
      var items = (month.expenditures && month.expenditures[cat]) || [];
      var actual = 0;
      for (var e = 0; e < items.length; e++) {
        actual += parseFloat(items[e].amount) || 0;
      }
      var budget = (month.budgets && month.budgets[cat] !== undefined) ? month.budgets[cat] : 0;
      grandTotal += actual;
      budgetTotal += parseFloat(budget) || 0;

      var diffClass = '';
      if (actual > budget && budget > 0) diffClass = ' over-budget';
      else if (actual <= budget && budget > 0) diffClass = ' under-budget';

      html += '<tr>';
      html += '<td>' + escapeHtml(cat) + '</td>';
      html += '<td class="amount-cell' + diffClass + '">' + formatMoney(actual) + '</td>';
      html += '<td class="budget-cell"><input type="text" inputmode="decimal" class="budget-input" value="' + attrEscape(budget !== undefined ? budget : '') + '" onchange="updateBudget(' + "'" + escapeJs(cat) + "'" + ',this.value)"></td>';
      html += '</tr>';
    }

    var fixedItems = (month.expenditures && month.expenditures['Fixed Expenses']) || [];
    var fixedTotal = 0;
    for (var f = 0; f < fixedItems.length; f++) {
      fixedTotal += parseFloat(fixedItems[f].amount) || 0;
    }
    grandTotal += fixedTotal;
    var fixedBudget = (month.budgets && month.budgets['Fixed Expenses'] !== undefined) ? month.budgets['Fixed Expenses'] : 0;
    budgetTotal += parseFloat(fixedBudget) || 0;

    html += '<tr>';
    html += '<td>Fixed Expenses</td>';
    html += '<td class="amount-cell">' + formatMoney(fixedTotal) + '</td>';
    html += '<td class="budget-cell"><input type="text" inputmode="decimal" class="budget-input" value="' + attrEscape(fixedBudget !== undefined ? fixedBudget : '') + '" onchange="updateBudget(' + "'" + 'Fixed Expenses' + "'" + ',this.value)"></td>';
    html += '</tr>';

    html += '</tbody>';
    html += '</table>';

    html += '<div class="grand-total">';
    html += '<div class="grand-total-label">Total Expenses</div>';
    html += '<div class="grand-total-value">' + formatMoney(grandTotal) + '</div>';
    html += '</div>';

    html += '<div class="ps-note">P.S. The evaluation of expenses is based from the 26th of each month.</div>';
    html += '</div>';
    return html;
  } catch (e) {
    console.error('renderSummaryTable error:', e);
    return '<div class="section-card" style="padding:16px;color:#ff6b6b;">Error loading Summary</div>';
  }
}

function nuclearReset() {
  if (!confirm('This will reset ALL data to defaults. Are you sure?')) return;
  try {
    var s = getStorage();
    if (s) s.removeItem(STORAGE_KEY);
  } catch (e) {}
  memoryStore = null;
  appData = createDefaultData();
  currentMonth = latestMonthKey() || currentCalendarMonthKey();
  saveData();
  renderMonthBar();
  renderMonth();
  showToast('Data reset to defaults');
}

function updateSalary(source, value) {
  try {
    if (appData.months[currentMonth] && appData.months[currentMonth].salary) {
      appData.months[currentMonth].salary[source] = value;
    }
    saveData();
    renderMonth();
  } catch (e) { console.error(e); }
}

function updateEntry(cat, index, field, value) {
  try {
    var month = appData.months[currentMonth];
    if (!month || !month.expenditures || !month.expenditures[cat]) return;
    if (field === 'date') {
      month.expenditures[cat][index].date = dateToSerial(value);
    } else {
      month.expenditures[cat][index][field] = value;
    }
    saveData();
    renderMonth();
  } catch (e) { console.error(e); }
}

function addEntry(cat) {
  try {
    var month = appData.months[currentMonth];
    if (!month.expenditures) month.expenditures = {};
    if (!month.expenditures[cat]) month.expenditures[cat] = [];
    month.expenditures[cat].push({ desc: '', date: '', amount: '' });
    saveData();
    renderMonth();
  } catch (e) { console.error(e); }
}

function deleteEntry(cat, index) {
  try {
    var month = appData.months[currentMonth];
    if (month && month.expenditures && month.expenditures[cat]) {
      month.expenditures[cat].splice(index, 1);
    }
    saveData();
    renderMonth();
  } catch (e) { console.error(e); }
}

function renameCategory(index, newName) {
  newName = (newName || '').trim();
  if (!newName) {
    showToast('Category name cannot be empty');
    renderMonth();
    return;
  }
  var config = appData.config;
  var oldName = config.categories[index];
  if (oldName === newName) return;

  if (config.categories.indexOf(newName) !== -1 && config.categories.indexOf(newName) !== index) {
    showToast('Category already exists');
    renderMonth();
    return;
  }

  config.categories[index] = newName;
  if (config.budgets[oldName] !== undefined) {
    config.budgets[newName] = config.budgets[oldName];
    delete config.budgets[oldName];
  }

  for (var m in appData.months) {
    var month = appData.months[m];
    if (!month.expenditures) month.expenditures = {};
    if (month.expenditures[oldName]) {
      month.expenditures[newName] = month.expenditures[oldName];
      delete month.expenditures[oldName];
    }
    if (month.budgets && month.budgets[oldName] !== undefined) {
      month.budgets[newName] = month.budgets[oldName];
      delete month.budgets[oldName];
    }
  }

  saveData();
  renderMonth();
  showToast('Category renamed');
}

function removeCategory(index) {
  var config = appData.config;
  if (config.categories.length <= 1) {
    showToast('Need at least one category');
    return;
  }
  var cat = config.categories[index];
  if (!confirm('Delete category "' + cat + '" and all its entries?')) return;

  config.categories.splice(index, 1);
  delete config.budgets[cat];

  for (var m in appData.months) {
    var month = appData.months[m];
    if (month.expenditures) delete month.expenditures[cat];
    if (month.budgets) delete month.budgets[cat];
  }

  saveData();
  renderMonth();
  showToast('Category removed');
}

function exportToExcel() {
  var wb = XLSX.utils.book_new();
  wb.Props = {
    Title: appData.config.appName || 'My Finances',
    Subject: 'Personal Bookkeeping',
    Author: 'My Finances App',
    CreatedDate: new Date()
  };

  var exportYear = yearOf(currentMonth);
  if (exportYear === null) exportYear = new Date().getFullYear();
  var months = getMonthKeysForYear(exportYear);
  var config = appData.config;

  // --- BABY BLUE COLOR PALETTE ---
  var babyBlue = '89CFF0';
  var darkerBlue = '5DADE2';
  var lightBlue = 'B8E3F5';
  var paleBlue = 'E8F6FC';
  var white = 'FFFFFF';
  var offWhite = 'F8FAFC';
  var textDark = '1a1a2e';
  var textMed = '4a4a6a';
  var textLight = '8a8aaa';
  var borderLight = 'd0e8f5';
  var borderMed = 'a8d8f0';
  var green = '52c41a';
  var red = 'ff4d4f';

  // --- STYLE DEFINITIONS ---
  function makeStyle(opts) {
    var s = { font: { name: 'Inter', sz: 10, color: { rgb: textDark } } };
    if (opts.bold) s.font.bold = true;
    if (opts.sz) s.font.sz = opts.sz;
    if (opts.color) s.font.color = { rgb: opts.color };
    if (opts.fill) s.fill = { fgColor: { rgb: opts.fill }, patternType: 'solid' };
    if (opts.align) s.alignment = { horizontal: opts.align, vertical: 'center' };
    if (opts.border) {
      s.border = {};
      ['top','bottom','left','right'].forEach(function(k) {
        s.border[k] = { style: opts.borderStyle || 'thin', color: { rgb: opts.border } };
      });
    }
    if (opts.numFmt) s.numFmt = opts.numFmt;
    return s;
  }

  var S = {
    monthTitle: makeStyle({ bold: true, sz: 22, color: white, fill: babyBlue, align: 'center', border: babyBlue, borderStyle: 'medium' }),
    cardTitle: makeStyle({ bold: true, sz: 9, color: textLight, fill: paleBlue, align: 'center', border: borderLight }),
    cardValue: makeStyle({ bold: true, sz: 16, color: darkerBlue, fill: paleBlue, align: 'center', border: borderLight }),
    sectionHeader: makeStyle({ bold: true, sz: 12, color: white, fill: babyBlue, align: 'left', border: babyBlue, borderStyle: 'medium' }),
    tableHeader: makeStyle({ bold: true, sz: 10, color: textDark, fill: lightBlue, align: 'center', border: borderMed }),
    tableCell: makeStyle({ sz: 10, color: textDark, fill: white, align: 'left', border: borderLight }),
    tableCellRight: makeStyle({ sz: 10, color: textDark, fill: white, align: 'right', border: borderLight }),
    tableCellCenter: makeStyle({ sz: 10, color: textDark, fill: white, align: 'center', border: borderLight }),
    totalRow: makeStyle({ bold: true, sz: 10, color: textDark, fill: paleBlue, align: 'left', border: borderMed, borderStyle: 'medium' }),
    totalRowRight: makeStyle({ bold: true, sz: 10, color: textDark, fill: paleBlue, align: 'right', border: borderMed, borderStyle: 'medium' }),
    overBudget: makeStyle({ bold: true, sz: 10, color: red, fill: white, align: 'right', border: borderLight }),
    underBudget: makeStyle({ bold: true, sz: 10, color: green, fill: white, align: 'right', border: borderLight }),
    note: makeStyle({ sz: 9, color: textLight, fill: white, align: 'center', border: borderLight }),
    miniHeader: makeStyle({ bold: true, sz: 10, color: textMed, fill: offWhite, align: 'center', border: borderLight }),
    miniCell: makeStyle({ sz: 9, color: textDark, fill: white, align: 'center', border: borderLight }),
    miniCellRight: makeStyle({ sz: 9, color: textDark, fill: white, align: 'right', border: borderLight }),
    empty: makeStyle({ fill: white })
  };

  function applyStyle(ws, range, style) {
    for (var R = range.s.r; R <= range.e.r; ++R) {
      for (var C = range.s.c; C <= range.e.c; ++C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        var cell = ws[addr];
        if (!cell) { cell = { v: '', t: 's' }; ws[addr] = cell; }
        cell.s = style;
      }
    }
  }

  function setColWidths(ws, widths) {
    ws['!cols'] = widths.map(function(w) { return { wch: w }; });
  }

  function fmtMoney(val) {
    if (val === '' || val === null || val === undefined || isNaN(val)) return '';
    return parseFloat(val).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // --- BUILD EACH MONTH SHEET ---
  for (var m = 0; m < months.length; m++) {
    var monthKey = months[m];
    var month = appData.months[monthKey];
    var monthName = monthNameOf(monthKey);
    var sheetTitle = monthName + ' ' + exportYear;
    var ws_data = [];
    var merges = [];
    var row = 0;

    // ===== ROW 0: MONTH TITLE =====
    ws_data[row] = [sheetTitle, '', '', '', '', '', '', '', '', '', '', ''];
    merges.push({ s: { r: row, c: 0 }, e: { r: row, c: 11 } });
    row++;

    // ===== ROW 1: EMPTY =====
    ws_data[row] = ['', '', '', '', '', '', '', '', '', '', '', ''];
    row++;

    // ===== ROW 2-3: SUMMARY CARDS =====
    var incomeTotal = 0;
    for (var s = 0; s < config.salarySources.length; s++) {
      incomeTotal += parseFloat(month.salary[config.salarySources[s]]) || 0;
    }

    var grandTotal = 0;
    var budgetTotal = 0;
    var categoryTotals = {};
    var categoryBudgets = {};
    for (var c = 0; c < config.categories.length; c++) {
      var cat = config.categories[c];
      var items = month.expenditures[cat];
      var catTotal = 0;
      for (var i = 0; i < items.length; i++) {
        catTotal += parseFloat(items[i].amount) || 0;
      }
      categoryTotals[cat] = catTotal;
      categoryBudgets[cat] = month.budgets[cat] || 0;
      grandTotal += catTotal;
      budgetTotal += month.budgets[cat] || 0;
    }
    var fixedItems = month.expenditures['Fixed Expenses'];
    var fixedTotal = 0;
    var fixedBudget = month.budgets['Fixed Expenses'] || 0;
    for (var f = 0; f < fixedItems.length; f++) {
      fixedTotal += parseFloat(fixedItems[f].amount) || 0;
    }
    grandTotal += fixedTotal;
    budgetTotal += fixedBudget;
    categoryTotals['Fixed Expenses'] = fixedTotal;
    categoryBudgets['Fixed Expenses'] = fixedBudget;

    var netIncome = incomeTotal - grandTotal;
    var leftToSpend = budgetTotal - grandTotal;
    if (leftToSpend < 0) leftToSpend = 0;
    var savingsRate = incomeTotal > 0 ? ((netIncome / incomeTotal) * 100).toFixed(1) : '0.0';

    // Card labels
    ws_data[row] = ['Left to Spend', '', '', 'Total Expenses', '', '', 'Net Income', '', '', 'Savings Rate', '', ''];
    merges.push({ s: { r: row, c: 0 }, e: { r: row, c: 2 } });
    merges.push({ s: { r: row, c: 3 }, e: { r: row, c: 5 } });
    merges.push({ s: { r: row, c: 6 }, e: { r: row, c: 8 } });
    merges.push({ s: { r: row, c: 9 }, e: { r: row, c: 11 } });
    row++;

    // Card values
    ws_data[row] = [leftToSpend, '', '', grandTotal, '', '', netIncome, '', '', savingsRate + '%', '', ''];
    merges.push({ s: { r: row, c: 0 }, e: { r: row, c: 2 } });
    merges.push({ s: { r: row, c: 3 }, e: { r: row, c: 5 } });
    merges.push({ s: { r: row, c: 6 }, e: { r: row, c: 8 } });
    merges.push({ s: { r: row, c: 9 }, e: { r: row, c: 11 } });
    row++;

    // ===== ROW 4: EMPTY =====
    ws_data[row] = ['', '', '', '', '', '', '', '', '', '', '', ''];
    row++;

    // ===== ROW 5+: INCOME TREND MINI TABLE =====
    ws_data[row] = ['Income Trend', '', '', '', 'Budget vs Actual', '', '', '', '', '', '', ''];
    merges.push({ s: { r: row, c: 0 }, e: { r: row, c: 3 } });
    merges.push({ s: { r: row, c: 4 }, e: { r: row, c: 7 } });
    row++;

    // Income Trend: Show all income sources with amounts
    ws_data[row] = ['Source', 'Amount', '% of Total', '', 'Category', 'Budget', 'Actual', 'Diff', '', '', '', ''];
    row++;

    var maxMiniRows = Math.max(config.salarySources.length, config.categories.length + 1);
    for (var mr = 0; mr < maxMiniRows; mr++) {
      // Income Trend column
      var incSrc = config.salarySources[mr] || '';
      var incAmt = incSrc ? (parseFloat(month.salary[incSrc]) || 0) : '';
      var incPct = (incAmt && incomeTotal > 0) ? ((incAmt / incomeTotal) * 100).toFixed(1) + '%' : '';

      // Budget vs Actual column
      var bvaCat = config.categories[mr] || '';
      var bvaBud = bvaCat ? (month.budgets[bvaCat] || 0) : '';
      var bvaAct = bvaCat ? (categoryTotals[bvaCat] || 0) : '';
      var bvaDiff = (bvaBud !== '' && bvaAct !== '') ? (bvaBud - bvaAct) : '';
      if (mr === config.categories.length) {
        bvaCat = 'Fixed Expenses';
        bvaBud = fixedBudget;
        bvaAct = fixedTotal;
        bvaDiff = fixedBudget - fixedTotal;
      }

      ws_data[row] = [incSrc, incAmt, incPct, '', bvaCat, bvaBud, bvaAct, bvaDiff, '', '', '', ''];
      row++;
    }

    // Mini table totals
    ws_data[row] = ['Total', incomeTotal, '100%', '', 'Total', budgetTotal, grandTotal, budgetTotal - grandTotal, '', '', '', ''];
    row++;

    // ===== ROW: EMPTY =====
    ws_data[row] = ['', '', '', '', '', '', '', '', '', '', '', ''];
    row++;

    // ===== DATA TABLES =====
    ws_data[row] = ['Income', '', '', '', 'Bills & Fixed', '', '', '', 'Expenses', '', '', ''];
    merges.push({ s: { r: row, c: 0 }, e: { r: row, c: 3 } });
    merges.push({ s: { r: row, c: 4 }, e: { r: row, c: 7 } });
    merges.push({ s: { r: row, c: 8 }, e: { r: row, c: 11 } });
    row++;

    ws_data[row] = ['Source', 'Payday', 'Amount', '', 'Name', 'Budget', 'Amount', '', 'Name', 'Budget', 'Amount', ''];
    row++;

    var maxRows = Math.max(config.salarySources.length, fixedItems.length, config.categories.length);
    maxRows = Math.max(maxRows, 5);

    for (var r2 = 0; r2 < maxRows; r2++) {
      var incomeSrc = config.salarySources[r2] || '';
      var incomeAmt = incomeSrc ? (month.salary[incomeSrc] || '') : '';
      var incomeDate = incomeSrc ? (monthName.substring(0, 3) + '-15') : '';

      var fixedName = fixedItems[r2] ? fixedItems[r2].name : '';
      var fixedAmt = fixedItems[r2] ? fixedItems[r2].amount : '';
      var fixedBud = fixedItems[r2] ? fixedBudget : '';

      // One row per category: the category total, so this block reconciles
      // with its own Total row below.
      var expCat = config.categories[r2] || '';
      var expName = expCat;
      var expBud = expCat ? (month.budgets[expCat] || '') : '';
      var expAmt = expCat ? (categoryTotals[expCat] || 0) : '';

      ws_data[row] = [incomeSrc, incomeDate, incomeAmt, '', fixedName, fixedBud, fixedAmt, '', expName, expBud, expAmt, ''];
      row++;
    }

    ws_data[row] = ['Total', '', incomeTotal, '', 'Total', fixedBudget, fixedTotal, '', 'Total', '', grandTotal - fixedTotal, ''];
    row++;

    // ===== SAVINGS & DEBT SECTION =====
    ws_data[row] = ['', '', '', '', '', '', '', '', '', '', '', ''];
    row++;

    ws_data[row] = ['Savings', '', '', '', '', '', '', '', 'Debt / Other', '', '', ''];
    merges.push({ s: { r: row, c: 0 }, e: { r: row, c: 3 } });
    merges.push({ s: { r: row, c: 8 }, e: { r: row, c: 11 } });
    row++;

    ws_data[row] = ['Name', 'Budget', 'Amount', '', '', '', '', '', 'Name', 'Budget', 'Amount', ''];
    row++;

    for (var sr = 0; sr < 5; sr++) {
      ws_data[row] = ['', '', '', '', '', '', '', '', '', '', '', ''];
      row++;
    }

    // ===== NOTE =====
    ws_data[row] = ['P.S. The evaluation of expenses is based from the 26th of each month.', '', '', '', '', '', '', '', '', '', '', ''];
    merges.push({ s: { r: row, c: 0 }, e: { r: row, c: 11 } });
    row++;

    // Create worksheet
    var ws = XLSX.utils.aoa_to_sheet(ws_data);
    ws['!merges'] = merges;
    setColWidths(ws, [18, 12, 14, 2, 18, 12, 14, 12, 18, 12, 14, 12]);

    // Apply styles
    applyStyle(ws, { s: { r: 0, c: 0 }, e: { r: 0, c: 11 } }, S.monthTitle);
    ws['!rows'] = [{ hpt: 40 }];

    // Summary cards
    applyStyle(ws, { s: { r: 2, c: 0 }, e: { r: 2, c: 11 } }, S.cardTitle);
    applyStyle(ws, { s: { r: 3, c: 0 }, e: { r: 3, c: 11 } }, S.cardValue);

    // Mini table headers (row 5 = labels, row 6 = column headers)
    applyStyle(ws, { s: { r: 5, c: 0 }, e: { r: 5, c: 7 } }, makeStyle({ bold: true, sz: 11, color: textMed, fill: offWhite, align: 'center', border: borderLight }));
    applyStyle(ws, { s: { r: 6, c: 0 }, e: { r: 6, c: 7 } }, S.miniHeader);

    // Mini table data
    var miniStart = 7;
    var miniEnd = miniStart + maxMiniRows;
    for (var mr2 = miniStart; mr2 < miniEnd; mr2++) {
      for (var mc = 0; mc < 8; mc++) {
        if (mc === 3) continue;
        var mAddr = XLSX.utils.encode_cell({ r: mr2, c: mc });
        var mCell = ws[mAddr];
        if (!mCell) continue;
        var isNum = typeof mCell.v === 'number';
        var isPct = (mc === 2);
        if (isNum && !isPct) {
          mCell.s = S.miniCellRight;
          mCell.z = 'R#,##0.00';
        } else if (isNum && isPct) {
          mCell.s = S.miniCell;
        } else {
          mCell.s = S.miniCell;
        }
      }
    }

    // Mini table totals
    var miniTotalRow = miniEnd;
    for (var mtc = 0; mtc < 8; mtc++) {
      if (mtc === 3) continue;
      var mtAddr = XLSX.utils.encode_cell({ r: miniTotalRow, c: mtc });
      var mtCell = ws[mtAddr];
      if (!mtCell) continue;
      if (mtc === 0 || mtc === 4) {
        mtCell.s = S.totalRow;
      } else {
        mtCell.s = S.totalRowRight;
        if (typeof mtCell.v === 'number') mtCell.z = 'R#,##0.00';
      }
    }

    // Section headers for main tables
    var mainHeaderRow = miniTotalRow + 2;
    applyStyle(ws, { s: { r: mainHeaderRow, c: 0 }, e: { r: mainHeaderRow, c: 3 } }, S.sectionHeader);
    applyStyle(ws, { s: { r: mainHeaderRow, c: 4 }, e: { r: mainHeaderRow, c: 7 } }, S.sectionHeader);
    applyStyle(ws, { s: { r: mainHeaderRow, c: 8 }, e: { r: mainHeaderRow, c: 11 } }, S.sectionHeader);

    // Main table headers
    var mainTableHeaderRow = mainHeaderRow + 1;
    for (var hc = 0; hc < 12; hc++) {
      if (hc === 3 || hc === 7 || hc === 11) continue;
      var hAddr = XLSX.utils.encode_cell({ r: mainTableHeaderRow, c: hc });
      if (ws[hAddr]) ws[hAddr].s = S.tableHeader;
    }

    // Main data cells
    var mainDataStart = mainTableHeaderRow + 1;
    var mainDataEnd = mainDataStart + maxRows;
    for (var dr = mainDataStart; dr < mainDataEnd; dr++) {
      for (var dc = 0; dc < 12; dc++) {
        if (dc === 3 || dc === 7 || dc === 11) continue;
        var dAddr = XLSX.utils.encode_cell({ r: dr, c: dc });
        var dCell = ws[dAddr];
        if (!dCell) continue;
        var isNum = typeof dCell.v === 'number';
        var isLastCol = (dc === 2 || dc === 6 || dc === 10);
        if (isLastCol && isNum) {
          dCell.s = S.tableCellRight;
          dCell.z = 'R#,##0.00';
        } else if (isLastCol) {
          dCell.s = S.tableCellRight;
        } else if (dc === 1 || dc === 5 || dc === 9) {
          dCell.s = S.tableCellCenter;
        } else {
          dCell.s = S.tableCell;
        }
      }
    }

    // Main total rows
    var mainTotalRow = mainDataEnd;
    for (var tc = 0; tc < 12; tc++) {
      if (tc === 3 || tc === 7 || tc === 11) continue;
      var tAddr = XLSX.utils.encode_cell({ r: mainTotalRow, c: tc });
      var tCell = ws[tAddr];
      if (!tCell) continue;
      if (tc === 0 || tc === 4 || tc === 8) {
        tCell.s = S.totalRow;
      } else {
        tCell.s = S.totalRowRight;
        if (typeof tCell.v === 'number') tCell.z = 'R#,##0.00';
      }
    }

    // Savings & Debt section
    var savingsHeaderRow = mainTotalRow + 2;
    applyStyle(ws, { s: { r: savingsHeaderRow, c: 0 }, e: { r: savingsHeaderRow, c: 3 } }, S.sectionHeader);
    applyStyle(ws, { s: { r: savingsHeaderRow, c: 8 }, e: { r: savingsHeaderRow, c: 11 } }, S.sectionHeader);

    var savingsTableHeaderRow = savingsHeaderRow + 1;
    for (var shc = 0; shc < 12; shc++) {
      if (shc === 3 || shc === 7 || shc === 11) continue;
      if (shc < 3 || shc >= 8) {
        var shAddr = XLSX.utils.encode_cell({ r: savingsTableHeaderRow, c: shc });
        if (ws[shAddr]) ws[shAddr].s = S.tableHeader;
      }
    }

    // Savings data cells
    for (var sdr = savingsTableHeaderRow + 1; sdr < savingsTableHeaderRow + 6; sdr++) {
      for (var sdc = 0; sdc < 12; sdc++) {
        if (sdc === 3 || sdc === 7 || sdc === 11) continue;
        if (sdc < 3 || sdc >= 8) {
          var sdAddr = XLSX.utils.encode_cell({ r: sdr, c: sdc });
          var sdCell = ws[sdAddr];
          if (!sdCell) continue;
          if (sdc === 2 || sdc === 10) {
            sdCell.s = S.tableCellRight;
          } else if (sdc === 1 || sdc === 9) {
            sdCell.s = S.tableCellCenter;
          } else {
            sdCell.s = S.tableCell;
          }
        }
      }
    }

    // Note
    var noteRow = savingsTableHeaderRow + 6;
    applyStyle(ws, { s: { r: noteRow, c: 0 }, e: { r: noteRow, c: 11 } }, S.note);

    // Row heights
    for (var rh = 0; rh < ws_data.length; rh++) {
      if (!ws['!rows'][rh]) ws['!rows'][rh] = {};
      if (rh === 0) ws['!rows'][rh].hpt = 40;
      else if (rh === 3) ws['!rows'][rh].hpt = 32;
      else if (rh === 5) ws['!rows'][rh].hpt = 26;
      else ws['!rows'][rh].hpt = 20;
    }

    XLSX.utils.book_append_sheet(wb, ws, sheetTitle);
  }

  // --- OVERVIEW SHEET ---
  var overviewData = [];
  var oRow = 0;

  overviewData[oRow] = [appData.config.appName || 'My Finances', '', '', '', ''];
  oRow++;
  overviewData[oRow] = ['Annual Overview ' + exportYear, '', '', '', ''];
  oRow++;
  overviewData[oRow] = ['', '', '', '', ''];
  oRow++;

  overviewData[oRow] = ['Month', 'Income', 'Expenses', 'Net', 'Savings %'];
  oRow++;

  var annualIncome = 0, annualExpenses = 0, annualNet = 0;

  for (var om = 0; om < months.length; om++) {
    var oMonthKey = months[om];
    var oMonthName = monthNameOf(oMonthKey);
    var oMonth = appData.months[oMonthKey];

    var oIncome = 0;
    for (var os = 0; os < config.salarySources.length; os++) {
      oIncome += parseFloat(oMonth.salary[config.salarySources[os]]) || 0;
    }

    var oExpenses = 0;
    for (var oc = 0; oc < config.categories.length; oc++) {
      var oCat = config.categories[oc];
      var oItems = oMonth.expenditures[oCat];
      for (var oi = 0; oi < oItems.length; oi++) {
        oExpenses += parseFloat(oItems[oi].amount) || 0;
      }
    }
    var oFixed = oMonth.expenditures['Fixed Expenses'];
    for (var of = 0; of < oFixed.length; of++) {
      oExpenses += parseFloat(oFixed[of].amount) || 0;
    }

    var oNet = oIncome - oExpenses;
    var oSavings = oIncome > 0 ? ((oNet / oIncome) * 100).toFixed(1) : '0.0';

    annualIncome += oIncome;
    annualExpenses += oExpenses;
    annualNet += oNet;

    overviewData[oRow] = [oMonthName, oIncome, oExpenses, oNet, oSavings + '%'];
    oRow++;
  }

  overviewData[oRow] = ['ANNUAL TOTAL', annualIncome, annualExpenses, annualNet, annualIncome > 0 ? ((annualNet / annualIncome) * 100).toFixed(1) + '%' : '0.0%'];
  oRow++;

  var wsOverview = XLSX.utils.aoa_to_sheet(overviewData);
  wsOverview['!merges'] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 4 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 4 } }
  ];
  setColWidths(wsOverview, [16, 14, 14, 14, 12]);

  applyStyle(wsOverview, { s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }, S.monthTitle);
  applyStyle(wsOverview, { s: { r: 1, c: 0 }, e: { r: 1, c: 4 } }, makeStyle({ bold: true, sz: 14, color: darkerBlue, fill: paleBlue, align: 'center', border: borderLight }));
  applyStyle(wsOverview, { s: { r: 3, c: 0 }, e: { r: 3, c: 4 } }, S.tableHeader);

  for (var or = 4; or < overviewData.length; or++) {
    for (var oc = 0; oc < 5; oc++) {
      var oAddr = XLSX.utils.encode_cell({ r: or, c: oc });
      var oCell = wsOverview[oAddr];
      if (!oCell) continue;
      if (typeof oCell.v === 'string' && oCell.v.indexOf('ANNUAL') === 0) {
        oCell.s = (oc === 0) ? S.totalRow : S.totalRowRight;
      } else {
        oCell.s = (oc === 0) ? S.tableCell : S.tableCellRight;
      }
      if (oc >= 1 && oc <= 3 && typeof oCell.v === 'number') {
        oCell.z = 'R#,##0.00';
      }
    }
  }

  wsOverview['!rows'] = [{ hpt: 40 }, { hpt: 28 }];
  for (var orh = 2; orh < overviewData.length; orh++) {
    if (!wsOverview['!rows'][orh]) wsOverview['!rows'][orh] = {};
    wsOverview['!rows'][orh].hpt = 22;
  }

  XLSX.utils.book_append_sheet(wb, wsOverview, 'Overview');

  // --- CONFIG SHEET ---
  var configData = [];
  configData.push(['Configuration', '']);
  configData.push(['App Name', appData.config.appName || 'My Finances']);
  configData.push(['', '']);
  configData.push(['Income Sources', '']);
  for (var cs = 0; cs < config.salarySources.length; cs++) {
    configData.push(['', config.salarySources[cs]]);
  }
  configData.push(['', '']);
  configData.push(['Categories', 'Default Budget']);
  for (var cc3 = 0; cc3 < config.categories.length; cc3++) {
    var ccat3 = config.categories[cc3];
    configData.push([ccat3, config.budgets[ccat3] || 0]);
  }
  configData.push(['Fixed Expenses', config.budgets['Fixed Expenses'] || 0]);
  configData.push(['', '']);
  configData.push(['Fixed Expense Details', 'Amount']);
  for (var cf = 0; cf < config.fixedExpenses.length; cf++) {
    configData.push([config.fixedExpenses[cf].name, config.fixedExpenses[cf].amount]);
  }

  var wsConfig = XLSX.utils.aoa_to_sheet(configData);
  var incomeSectionStart = 3;
  var catSectionStart = incomeSectionStart + config.salarySources.length + 2;
  var fixedDetailStart = catSectionStart + config.categories.length + 3;

  wsConfig['!merges'] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 1 } },
    { s: { r: incomeSectionStart, c: 0 }, e: { r: incomeSectionStart, c: 1 } },
    { s: { r: catSectionStart, c: 0 }, e: { r: catSectionStart, c: 1 } },
    { s: { r: fixedDetailStart, c: 0 }, e: { r: fixedDetailStart, c: 1 } }
  ];
  setColWidths(wsConfig, [25, 20]);

  applyStyle(wsConfig, { s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }, S.monthTitle);

  for (var cr2 = 0; cr2 < configData.length; cr2++) {
    for (var cc4 = 0; cc4 < 2; cc4++) {
      var cAddr2 = XLSX.utils.encode_cell({ r: cr2, c: cc4 });
      var cCell2 = wsConfig[cAddr2];
      if (!cCell2 || cr2 === 0) continue;

      var isHeader = (cr2 === incomeSectionStart || cr2 === catSectionStart || cr2 === fixedDetailStart);
      if (isHeader) {
        cCell2.s = S.sectionHeader;
      } else if (cc4 === 0 && typeof cCell2.v === 'string' && cCell2.v !== '') {
        cCell2.s = S.tableCell;
      } else {
        cCell2.s = S.tableCellRight;
      }
    }
  }

  wsConfig['!rows'] = [{ hpt: 40 }];
  for (var crh = 1; crh < configData.length; crh++) {
    if (!wsConfig['!rows'][crh]) wsConfig['!rows'][crh] = {};
    wsConfig['!rows'][crh].hpt = 22;
  }

  XLSX.utils.book_append_sheet(wb, wsConfig, 'Configuration');

  // Write file
  var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  var blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (appData.config.appName || 'My_Finances') + '_' + exportYear + '.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Android Chrome fetches the blob after click() returns; revoking right away breaks the download.
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);

  showToast('Excel exported successfully!');
}

// ============================================================
// BUDGET OPERATIONS
// ============================================================
function updateBudget(cat, value) {
  var amt = parseFloat(value) || 0;
  appData.months[currentMonth].budgets[cat] = amt;
  // Also update config so new months inherit the latest budget
  appData.config.budgets[cat] = amt;
  saveData();
  renderMonth();
  showToast('Budget updated');
}

// ============================================================
// APP INITIALIZATION
// ============================================================
initData();
renderMonthBar();
renderMonth();
</script>
</body>
</html>
